left_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 2.0
  kinematics_solver_attempts: 20
  mode: local
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.01
  orientation_threshold: 0.08
  approximate_solution_position_threshold: 0.03
  approximate_solution_orientation_threshold: 0.15
  cost_threshold: 0.05
  minimal_displacement_weight: 0.002
  center_joints_weight: 0.001
  avoid_joint_limits_weight: 0.01
  gd_step_size: 0.0001
  gd_max_iters: 250
  memetic_num_threads: 4
  memetic_population_size: 32
  memetic_elite_size: 8
  memetic_max_generations: 120
  memetic_gd_max_iters: 40
  memetic_gd_max_time: 0.01
right_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 2.0
  kinematics_solver_attempts: 20
  mode: local
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.01
  orientation_threshold: 0.08
  approximate_solution_position_threshold: 0.03
  approximate_solution_orientation_threshold: 0.15
  cost_threshold: 0.05
  minimal_displacement_weight: 0.002
  center_joints_weight: 0.001
  avoid_joint_limits_weight: 0.01
  gd_step_size: 0.0001
  gd_max_iters: 250
  memetic_num_threads: 4
  memetic_population_size: 32
  memetic_elite_size: 8
  memetic_max_generations: 120
  memetic_gd_max_iters: 40
  memetic_gd_max_time: 0.01
