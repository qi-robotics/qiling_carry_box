# Pinocchio solver parameters. Keep kinematics_pick_ik.yaml as the A/B baseline.
left_arm:
  kinematics_solver: qi_robot_pinocchio_ik/PinocchioIKPlugin
  kinematics_solver_timeout: 2.0
  kinematics_solver_attempts: 20
  position_threshold: 0.01
  orientation_threshold: 0.08
  damping: 0.001
  max_step: 0.15
  max_iterations: 250
right_arm:
  kinematics_solver: qi_robot_pinocchio_ik/PinocchioIKPlugin
  kinematics_solver_timeout: 2.0
  kinematics_solver_attempts: 20
  position_threshold: 0.01
  orientation_threshold: 0.08
  damping: 0.001
  max_step: 0.15
  max_iterations: 250
